<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How R300 000 of taxable income is taxed</title>
  <desc id="d">2027 tax year, someone under 65. The first R245 100 is taxed at 18%, which is R44 118. The next R54 900 is taxed at 26%, which is R14 274. Tax before rebates is R58 392. Minus the primary rebate of R17 820, the tax for the year is R40 572, about 13.5% of income.</desc>
  <rect width="720" height="380" rx="12" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">How R300 000 of taxable income is taxed</text>
  <text x="40" y="68" font-size="14" fill="#52514e">2027 tax year, under 65. Each rate applies only to the slice of income in its bracket.</text>

  <!-- stacked bar: 600px = R300 000 -->
  <rect x="40" y="96" width="490" height="44" rx="4" fill="#2a78d6"/>
  <rect x="532" y="96" width="108" height="44" rx="4" fill="#eb6834"/>
  <text x="56" y="124" font-size="15" font-weight="600" fill="#ffffff">First R245 100 at 18%</text>
  <text x="586" y="124" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">26%</text>
  <line x1="40" y1="150" x2="40" y2="158" stroke="#52514e"/>
  <line x1="531" y1="150" x2="531" y2="158" stroke="#52514e"/>
  <line x1="640" y1="150" x2="640" y2="158" stroke="#52514e"/>
  <text x="40" y="176" font-size="13" fill="#52514e">R0</text>
  <text x="531" y="176" font-size="13" fill="#52514e" text-anchor="middle">R245 100</text>
  <text x="640" y="176" font-size="13" fill="#52514e" text-anchor="middle">R300 000</text>

  <!-- the sums -->
  <rect x="40" y="200" width="14" height="14" rx="3" fill="#2a78d6"/>
  <text x="64" y="212" font-size="15" fill="#0b0b0b">18% of R245 100</text>
  <text x="640" y="212" font-size="15" fill="#0b0b0b" text-anchor="end">R44 118</text>
  <rect x="40" y="228" width="14" height="14" rx="3" fill="#eb6834"/>
  <text x="64" y="240" font-size="15" fill="#0b0b0b">26% of the next R54 900</text>
  <text x="640" y="240" font-size="15" fill="#0b0b0b" text-anchor="end">+ R14 274</text>
  <line x1="40" y1="256" x2="640" y2="256" stroke="#d9d8d3"/>
  <text x="64" y="278" font-size="15" fill="#0b0b0b">Tax before rebates</text>
  <text x="640" y="278" font-size="15" fill="#0b0b0b" text-anchor="end">R58 392</text>
  <text x="64" y="304" font-size="15" fill="#0b0b0b">Primary rebate (everyone gets it)</text>
  <text x="640" y="304" font-size="15" fill="#0b0b0b" text-anchor="end">− R17 820</text>
  <line x1="40" y1="318" x2="640" y2="318" stroke="#0b0b0b"/>
  <text x="64" y="342" font-size="16" font-weight="700" fill="#0b0b0b">Tax for the year (about 13.5% of income)</text>
  <text x="640" y="342" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="end">R40 572</text>
  <text x="40" y="368" font-size="12" fill="#52514e">Figures: SARS, rates of tax for individuals, 2027 tax year. Not tax advice.</text>
</svg>
