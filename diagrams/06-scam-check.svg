<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Is this message really from SARS?</title>
  <desc id="d">A message says it is from SARS. Does it ask for a password, PIN or bank details? If yes, it is a scam. Does it have a link to claim a refund or to pay? If yes, it is a scam. If neither, and you are still unsure, don't click anything: log in to eFiling or the SARS MobiApp yourself and check there.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="720" height="420" rx="12" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">Is this message really from SARS?</text>

  <rect x="40" y="70" width="300" height="44" rx="8" fill="#2a78d6"/>
  <text x="190" y="98" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">A message says it's from SARS</text>
  <line x1="190" y1="114" x2="190" y2="140" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="146" width="300" height="62" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="190" y="172" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Does it ask for a password,</text>
  <text x="190" y="192" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">PIN or bank details?</text>
  <line x1="340" y1="177" x2="434" y2="177" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="387" y="169" font-size="13" fill="#52514e" text-anchor="middle">Yes</text>
  <line x1="190" y1="208" x2="190" y2="236" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="227" font-size="13" fill="#52514e">No</text>

  <rect x="40" y="242" width="300" height="62" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="190" y="268" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Does it have a link to "claim</text>
  <text x="190" y="288" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">a refund" or to pay?</text>
  <line x1="340" y1="273" x2="434" y2="273" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="387" y="265" font-size="13" fill="#52514e" text-anchor="middle">Yes</text>
  <line x1="190" y1="304" x2="190" y2="332" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
  <text x="200" y="323" font-size="13" fill="#52514e">No</text>

  <rect x="440" y="146" width="240" height="158" rx="8" fill="#fbeaea" stroke="#d03b3b" stroke-width="2"/>
  <text x="560" y="200" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">✕  Scam</text>
  <text x="560" y="228" font-size="14" fill="#0b0b0b" text-anchor="middle">Don't reply, click or call.</text>
  <text x="560" y="250" font-size="14" fill="#0b0b0b" text-anchor="middle">SARS never asks for these,</text>
  <text x="560" y="270" font-size="14" fill="#0b0b0b" text-anchor="middle">and refunds only go to the</text>
  <text x="560" y="290" font-size="14" fill="#0b0b0b" text-anchor="middle">bank account on your profile.</text>

  <rect x="40" y="338" width="640" height="56" rx="8" fill="#e7f6ee" stroke="#0ca30c" stroke-width="2"/>
  <text x="60" y="362" font-size="15" font-weight="600" fill="#0b0b0b">Still unsure? Don't click anything.</text>
  <text x="60" y="382" font-size="14" fill="#0b0b0b">Open eFiling or the SARS MobiApp yourself, and check your messages there.</text>
  <text x="40" y="412" font-size="12" fill="#52514e">Source: SARS scams and phishing. Not legal advice.</text>
</svg>
